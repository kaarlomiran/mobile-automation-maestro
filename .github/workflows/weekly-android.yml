name: Weekly Android suite

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: weekly-android
  cancel-in-progress: false

jobs:
  android:
    name: TC01-TC12 on Android ${{ matrix.api }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI baseline emulator (x86_64, hardware-accelerated). The full small/large/tablet matrix on
          # Android 17 stays a local run (arm64 AVDs, see config/devices.csv and docs/DEVICE-MATRIX.md).
          - api: 34
            profile: pixel_6
            device_id: ci-phone-api34
            device_class: "phone (CI)"
    env:
      MAESTRO_VERSION: "2.12.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install tools (Maestro, ffmpeg, male TTS voice, Pillow)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python3 -m venv .venv
          .venv/bin/pip install -q -r scripts/requirements.txt

      - name: Fetch app under test (Wikipedia sample APK) and page objects
        run: |
          mkdir -p apps
          curl -fsSL -o /tmp/samples.zip https://storage.googleapis.com/mobile.dev/samples/samples.zip
          unzip -o -j /tmp/samples.zip wikipedia.apk -d apps
          mv apps/wikipedia.apk apps/android.apk
          ./scripts/sync-pom.sh

      - name: Run the suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/android.apk
            DEVICE_ID=${{ matrix.device_id }} DEVICE_CLASS="${{ matrix.device_class }}" ./scripts/run-android-report.sh

      - name: Publish summary
        if: always()
        run: |
          for r in runs/report/*/; do
            echo "### $(basename "$r")" >> "$GITHUB_STEP_SUMMARY"
            cat "$r/summary.md" "$r/output-check.md" "runs/issues/$(basename "$r")/triage.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          done

      - name: Fail the job if any test failed
        if: always()
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          bad = 0
          for f in glob.glob("runs/report/*/results.json"):
              r = json.load(open(f))
              failed = [t["tc"] for t in r["tests"] if t.get("result") != "PASS"]
              print(f, "failed:", failed or "none"); bad += len(failed)
          if not glob.glob("runs/report/*/results.json"): print("no results produced"); bad = 1
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload run evidence (screenshots, recordings, traces, reports, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-android-api${{ matrix.api }}
          path: runs/
          retention-days: 30
