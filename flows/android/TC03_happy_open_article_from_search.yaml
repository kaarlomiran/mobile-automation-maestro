# TC03 [happy path][search] Tapping a search result opens the article page.
appId: ${APP_ID}
tags: [regression, happy, search]
---
- runFlow: ../subflows/start_at_search.yaml
- runFlow:
    file: ../../pom/android/pages/search_enter_query.yaml
    env: { QUERY: "Albert Einstein" }
- runFlow: ../../pom/android/pages/search_assert_results_list.yaml
- runFlow:
    file: ../../pom/android/pages/search_open_top_result.yaml
    env: { RESULT_DESCRIPTION: "German-born theoretical physicist.*" }
- runFlow:
    file: ../../pom/android/pages/article_assert_loaded.yaml
    env: { TAGLINE: "German-born theoretical physicist.*" }
- assertVisible: "Albert Einstein"               # article title
- assertVisible: "Contents"
- assertVisible: "Language"
- assertNotVisible:                              # left the search screen
    id: "org.wikipedia:id/search_src_text"
- assertNotVisible: "No results"
- runFlow: ../../pom/android/pages/app_assert_no_crash.yaml
