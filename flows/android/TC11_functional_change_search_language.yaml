# TC11 [functional][search] Adding Spanish and switching the search tab returns Spanish-language results.
appId: ${APP_ID}
tags: [regression, functional, search, language]
---
- runFlow: ../subflows/start_at_search.yaml
- runFlow: ../../pom/android/pages/search_assert_default_language.yaml
- runFlow:
    file: ../../pom/android/pages/language_add.yaml
    env: { LANGUAGE: "Español" }
- runFlow: ../../pom/android/pages/search_assert_language_tabs.yaml
- runFlow:
    file: ../../pom/android/pages/search_enter_query.yaml
    env: { QUERY: "Albert Einstein" }
- runFlow:
    file: ../../pom/android/pages/search_select_language_tab.yaml
    env: { TAB_LABEL: "ESPAÑOL" }
- runFlow: ../../pom/android/pages/search_assert_spanish_results.yaml
- runFlow:
    file: ../../pom/android/pages/search_select_language_tab.yaml
    env: { TAB_LABEL: "ENGLISH" }
- runFlow: ../../pom/android/pages/search_assert_results_for_einstein.yaml   # switching back restores English
- runFlow: ../../pom/android/pages/app_assert_no_crash.yaml
