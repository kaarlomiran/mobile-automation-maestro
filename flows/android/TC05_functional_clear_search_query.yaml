# TC05 [functional][search] The X button clears the query and removes the results.
appId: ${APP_ID}
tags: [regression, functional, search]
---
- runFlow: ../subflows/start_at_search.yaml
- runFlow:
    file: ../../pom/android/pages/search_enter_query.yaml
    env: { QUERY: "Albert Einstein" }
- runFlow: ../../pom/android/pages/search_assert_results_for_einstein.yaml
- assertVisible:
    id: "org.wikipedia:id/search_close_btn"      # X is offered while a query exists
- runFlow: ../../pom/android/pages/search_clear_query.yaml
- assertNotVisible: "German-born theoretical physicist.*"
- assertNotVisible: "Albert Einstein College of Medicine"
- runFlow: ../../pom/android/pages/search_assert_empty.yaml
- assertVisible:
    id: "org.wikipedia:id/search_src_text"       # field still usable
- runFlow: ../../pom/android/pages/app_assert_no_crash.yaml
