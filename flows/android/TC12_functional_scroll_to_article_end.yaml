# TC12 [functional] Scrolling a long article reaches the end of the page (footer license + browser link).
# Swipes cost ~7 s each, so the bottom is reached via swipes + the Contents menu (last section).
# Finding (cycle 04): on Android 17 off-screen WebView content is in the accessibility tree, so visibility asserts on
# article content can't prove scrolling; the collapsing toolbar is used as scroll proof instead (see POM page).
appId: ${APP_ID}
tags: [regression, functional, article]
---
- runFlow: ../subflows/start_at_search.yaml
- runFlow:
    file: ../../pom/android/pages/search_enter_query.yaml
    env: { QUERY: "Albert Einstein" }
- runFlow:
    file: ../../pom/android/pages/search_open_top_result.yaml
    env: { RESULT_DESCRIPTION: "German-born theoretical physicist.*" }
- runFlow:
    file: ../../pom/android/pages/article_assert_loaded.yaml
    env: { TAGLINE: "German-born theoretical physicist.*" }
- runFlow:
    file: ../../pom/android/pages/article_scroll_to_end.yaml
    env: { LAST_SECTION: "External links" }
- runFlow: ../../pom/android/pages/app_assert_no_crash.yaml
